services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipaytech
      POSTGRES_PASSWORD: ipaytech_local_password
      POSTGRES_DB: ipaytech_ops
    volumes:
      - ipaytech-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipaytech -d ipaytech_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://ipaytech:ipaytech_local_password@db:5432/ipaytech_ops
      AUTH_SECRET: local-development-only-change-this-secret-123456
      DEFAULT_TIMEZONE: Africa/Harare
      DEFAULT_CURRENCY: USD
      STORAGE_DRIVER: local
      HEALTHCHECK_DATABASE: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  ipaytech-postgres:
